services:
  relay:
    build:
      context: ..
      dockerfile: Dockerfile.customer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - customer-data:/data
    environment:
      VY_PUBLIC_URL: ${VY_PUBLIC_URL:?Set the stable HTTPS service origin}
      VY_ENCRYPTION_KEY: ${VY_ENCRYPTION_KEY:?Provide a persistent Fernet encryption key}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:?Operator Slack client ID}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:?Operator Slack client secret}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:?Operator Slack signing secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ATLASSIAN_CLIENT_ID: ${ATLASSIAN_CLIENT_ID:-}
      ATLASSIAN_CLIENT_SECRET: ${ATLASSIAN_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Operator model service key}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2-alpine
    profiles: [production]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      VY_PUBLIC_URL: ${VY_PUBLIC_URL:?Set the stable HTTPS service origin}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      relay:
        condition: service_healthy
volumes:
  caddy-data:
  caddy-config:
  customer-data:
