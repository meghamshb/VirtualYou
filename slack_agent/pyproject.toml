[project]
name = "virtualyou"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "slack-sdk==3.44.1",
    "slack-bolt==1.30.0",
    "slack-cli-hooks==0.3.0",
    "openai-agents==0.22.2",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.setuptools.packages.find]
include = ["agent*", "listeners*", "thread_context*", "virtualyou_workflow*"]

[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.format]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_file = "logs/pytest.log"
log_file_level = "DEBUG"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
