[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-you-ingest"
version = "0.1.0"
description = "Local, redaction-first ingestion pipeline for Virtual You"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
backend = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "httpx>=0.27,<1",
  "ruff>=0.9,<1",
]
github = [
  "httpx>=0.27,<1",
  "starlette>=0.38,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
virtual-you = "virtual_you.cli:main"
virtual-you-server = "virtual_you.backend.cli:main"

[tool.setuptools.package-data]
"virtual_you.backend" = ["static/*.html", "static/*.js", "static/*.css"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["virtual_you"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 75

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
